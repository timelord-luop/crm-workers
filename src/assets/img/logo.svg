<svg xmlns="http://www.w3.org/2000/svg" width="160" height="160" viewBox="0 0 160 160" role="img" aria-labelledby="title desc">
  <title id="title">CRM Logo</title>
  <desc id="desc">蓝色背景、白线简约风格的 CRM 客户管理系统图标</desc>

  <!-- 蓝色背景 -->
  <rect x="0" y="0" width="160" height="160" rx="24" fill="#2563EB"/>

  <!-- 客户网络线条 -->
  <g stroke="white" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none" opacity="0.9">
    <circle cx="52" cy="52" r="6" fill="white"/>
    <circle cx="108" cy="44" r="6" fill="white"/>
    <circle cx="84" cy="100" r="6" fill="white"/>
    <path d="M57 56 L102 48" />
    <path d="M60 58 L82 96" />
    <path d="M101 48 L86 96" />
  </g>

  <!-- 用户头像 -->
  <g transform="translate(92,86)" fill="white">
    <circle cx="20" cy="14" r="10"/>
    <path d="M6 44c0-7 8-12 22-12s22 5 22 12v6H6v-6z" opacity="0.95"/>
  </g>

  <!-- 外框微亮线条 -->
  <rect x="2" y="2" width="156" height="156" rx="24" stroke="white" stroke-width="2" fill="none" opacity="0.3"/>
</svg>
